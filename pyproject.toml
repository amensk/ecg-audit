[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-audit"
version = "0.1.0"
description = "Calibration auditing and recalibration for ECG foundation models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AutoR Research Workflow"}]
keywords = ["ecg", "calibration", "foundation-models", "reliability", "clinical-ml"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ecg-audit = "ecg_audit.cli:main"

[project.urls]
Homepage = "https://github.com/amensk/ecg-audit"
Repository = "https://github.com/amensk/ecg-audit"

[tool.setuptools]
packages = ["ecg_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
